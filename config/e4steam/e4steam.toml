# Whether to hide the domain on chat and only allow copying
# default: false
hideDomainInChat = false
# Allows use of dedicated server commands such as /ban and /whitelist in a shared LAN world
# default: true
restoreDedicatedCommands = true
# Whether to use the Minecraft whitelist on LAN worlds shared through Steam
# default: false
useWhiteList = false
# Whether to share opened LAN worlds through Steam P2P and Valve relays
# default: true
hostEnabled = true
# Fallback UDP port for voice mods and other UDP services; Simple Voice Chat and Plasmo Voice are detected automatically; use 0 to disable the fallback
# default: 24454
voiceChatPort = 24454
# Experimental: on Linux and macOS, relaunch Minecraft before LWJGL starts so LWJGL starts so Steam can inject its overlay; set true to enable
# default: false
overlayRelaunch = false
