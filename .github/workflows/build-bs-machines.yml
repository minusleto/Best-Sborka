name: Build bs-machines mod

on:
  push:
    paths:
      - 'mods-src/bs-machines/**'
      - '.github/workflows/build-bs-machines.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mods-src/bs-machines
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: List jars
        run: ls -la build/libs

      - uses: actions/upload-artifact@v4
        with:
          name: bs-machines-jar
          path: |
            mods-src/bs-machines/build/libs/bs-machines-*.jar
            !mods-src/bs-machines/build/libs/*-sources.jar

      - name: Publish rolling release (main only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bs-machines-latest
          name: bs-machines (latest build)
          body: Automatic build of mods-src/bs-machines from main. Put the jar into the mods folder.
          prerelease: true
          files: |
            mods-src/bs-machines/build/libs/bs-machines-*.jar
