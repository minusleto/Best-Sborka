plugins {
    id("idea")
    id("java")
    id "net.neoforged.moddev.legacyforge" version "2.0.141"
}

// Build setup adapted from IC2C Extras (Trinsdar), which targets the same IC2 Classic 1.19.2.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

version = "${mod_version}"
group = "bestsborka.machines"

base {
    archivesName = "bs-machines"
}

legacyForge {
    version = "${project.minecraft_version}-${project.forge_version}"
    parchment {
        minecraftVersion = project.minecraft_version
        mappingsVersion = project.mappings_version
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

java {
    withSourcesJar()
}

repositories {
    maven { url "https://repo.spongepowered.org/repository/maven-public" }
    maven {
        name = 'parchment'
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven { url "https://maven.shedaniel.me" }
    maven { url = "https://api.modrinth.com/maven" }
    maven { url "https://cursemaven.com" }
    maven {
        name = "Resourceful Bees Maven"
        url = "https://nexus.resourcefulbees.com/repository/maven-public/"
    }
}

dependencies {
    // Same IC2 Classic build that IC2C Extras compiles against (works with 2.1.3.3+ at runtime).
    modImplementation("curse.maven:ic2_classic-242942:8010709")
    modImplementation("curse.maven:curios-309927:3871347")
    modImplementation("maven.modrinth:carbon-config:HMD2FUea")
    modImplementation("earth.terrarium:botarium-forge-${project.minecraft_version}:1.8.2")
    modImplementation("curse.maven:jei-238222:4712866")
}

processResources {
    inputs.property "version", project.mod_version
    filesMatching("META-INF/mods.toml") {
        expand "version": project.mod_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : "minusleto",
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : "minusleto"
        ])
    }
}
